<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- เหรียญไดอารี่ ChimChim: เหรียญทองขอบหนา ตรงกลางเป็นรอยเท้าไดโนเสาร์ (สามนิ้วมีเล็บ) + ประกาย -->
  <defs>
    <linearGradient id="cnRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe66e"/>
      <stop offset="0.55" stop-color="#f7b500"/>
      <stop offset="1" stop-color="#d98200"/>
    </linearGradient>
    <radialGradient id="cnFace" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.6" stop-color="#fbc21f"/>
      <stop offset="1" stop-color="#f0a500"/>
    </radialGradient>
    <linearGradient id="cnPad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#fbe2b0"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="64" rx="54" ry="53" fill="#c97400"/>
  <circle cx="60" cy="59" r="54" fill="url(#cnRim)"/>
  <circle cx="60" cy="59" r="43" fill="url(#cnFace)" stroke="#e39400" stroke-width="2.5"/>
