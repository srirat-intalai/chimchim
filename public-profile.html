<!DOCTYPE html>
<html lang="th">
   <head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="author" content="CHIMCHIM">
      <link rel="manifest" href="manifest.json">
      <meta name="theme-color" content="#6842b5">
      <meta name="apple-mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-status-bar-style" content="default">
      <meta name="apple-mobile-web-app-title" content="ChimChim">
      <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
      <meta name="description" content="ChimChim - โปรไฟล์นักชิมในชุมชน">
      <title>โปรไฟล์ - ChimChim</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
      <link rel="stylesheet" href="css/all.min.css"/>
      <link rel="stylesheet" href="css/style.css" />
      <link rel="stylesheet" href="css/chimchim-refresh.css" />
   </head>
   <body class="appshell">
      <div class="obtopnav" style="max-width:520px;margin:0 auto;padding:20px 20px 0;">
         <button class="obback" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
         <span class="obstepnum" data-i18n="nav.profile">โปรไฟล์</span>
         <span style="width:38px;"></span>
      </div>

      <!-- ระหว่างรอถามโปรไฟล์จริงจาก Supabase (คนที่เครื่องนี้ไม่เคยเห็นมาก่อน) โชว์โครงนี้แทนที่จะโผล่ว่าง ๆ ก่อนเจอจริง -->
      <div class="profwrap" id="ppSkeleton" hidden>
         <div class="profhead">
            <div class="skeleton" style="width:64px;height:64px;border-radius:50%;flex-shrink:0;"></div>
            <div style="flex:1;">
               <div class="skeleton" style="height:18px;width:60%;margin-bottom:8px;"></div>
               <div class="skeleton" style="height:13px;width:40%;"></div>
            </div>
         </div>
         <div class="skeleton" style="height:38px;width:100%;border-radius:50px;margin:14px 0;"></div>
      </div>

      <div class="profwrap" id="ppContent">
         <div class="profhead">
            <div class="profavatar" id="ppAvatar"></div>
            <div>
               <div class="profname" id="ppName"></div>
               <div class="profemail" id="ppSub"></div>
               <span class="profrole" id="ppLevel"></span>
            </div>
         </div>

         <!-- ตัวเลขแบบ IG: โพสต์ · ผู้ติดตาม · กำลังติดตาม (นักชิม) หรือ รีวิว (ร้าน) -->
         <div class="igstats ppstats" id="ppStats">
            <div class="igstat"><b id="ppStatPosts">0</b><span data-i18n="profile.statPosts">โพสต์</span></div>
            <div class="igstat"><b id="ppStatFollowers">0</b><span data-i18n="profile.statFollowers">ผู้ติดตาม</span></div>
            <div class="igstat"><b id="ppStatThird">0</b><span id="ppStatThirdLbl" data-i18n="profile.statFollowing">กำลังติดตาม</span></div>
         </div>

         <p class="sdesc mb-3" id="ppBio" style="font-size:.85rem;"></p>

         <!-- Food DNA ของนักชิมคนนี้ (สาธารณะ) — แสดงเฉพาะโปรไฟล์ผู้ใช้ที่ทำแบบทดสอบแล้ว -->
         <section class="ppdna" id="ppDna" hidden aria-labelledby="ppDnaTit">
            <div class="ppdna-head">
               <h2 class="ppdna-tit" id="ppDnaTit"><i class="fas fa-dna"></i><span data-i18n="publicprofile.foodDna">Food DNA</span></h2>
               <span class="ppdna-match" id="ppDnaMatch" hidden></span>
            </div>
            <div class="ppdna-rows" id="ppDnaRows"></div>
         </section>

         <button class="btn-red profbtn" id="ppFollowBtn"><i class="fas fa-user-plus"></i><span data-i18n="common.follow">Follow</span></button>

         <!-- แท็บ โพสต์ / รีวิว — แสดงเฉพาะโปรไฟล์ร้านค้า (โปรไฟล์นักชิมยังเป็นการ์ดโพสต์ล่าสุดแบบเดิม) -->
         <div class="proftabs ppshoptabs" id="ppShopTabs" role="tablist" data-i18n-aria="publicprofile.shopTabs" aria-label="โพสต์และรีวิวของร้าน" hidden>
            <button type="button" class="proftab active" role="tab" id="ppTabPosts" data-pptab="posts" aria-controls="ppPostsCard" aria-selected="true" data-i18n-title="publicprofile.tabPosts" title="โพสต์"><i class="fas fa-table-cells"></i></button>
            <button type="button" class="proftab" role="tab" id="ppTabReviews" data-pptab="reviews" aria-controls="ppReviewsPane" aria-selected="false" tabindex="-1" data-i18n-title="publicprofile.tabReviews" title="รีวิว"><i class="fas fa-pen"></i></button>
         </div>

         <div class="profcard" id="ppPostsCard" role="tabpanel" aria-labelledby="ppTabPosts">
            <div class="profcardtit" id="ppPostsTit"><i class="fas fa-image me-1"></i><span data-i18n="publicprofile.recentPosts">โพสต์ล่าสุด</span></div>
            <div class="ppgrid" id="ppPostGrid"></div>
            <p id="ppEmpty" class="text-center" style="color:#bbb;font-size:.82rem;padding:20px 0;" hidden data-i18n="publicprofile.noPosts">ยังไม่มีโพสต์</p>
         </div>

         <div class="ppreviewspane" id="ppReviewsPane" role="tabpanel" aria-labelledby="ppTabReviews" hidden>
            <div id="ppReviewList"></div>
            <p class="ppreviewsloading" id="ppReviewsLoading" hidden><i class="fas fa-spinner fa-spin"></i></p>
            <div class="ppreviewsempty" id="ppReviewsEmpty" hidden>
               <i class="fas fa-pen" aria-hidden="true"></i>
               <p data-i18n="publicprofile.noReviews">ร้านนี้ยังไม่มีรีวิว</p>
            </div>
         </div>
      </div>

      <!-- ============================================================
         AUTH POPUP — เข้าสู่ระบบ / สมัครสมาชิก (เด้งอัตโนมัติเมื่อกดติดตามโดยยังไม่ล็อกอิน)
         ============================================================ -->
      <div id="authPop">
         <div class="apbox">
            <button class="apclose" id="apClose"><i class="fas fa-times"></i></button>
            <div class="aptabs">
               <button class="aptab active" id="apTabLogin" data-tab="login" data-i18n="auth.login">เข้าสู่ระบบ</button>
               <button class="aptab" id="apTabRegister" data-tab="register" data-i18n="auth.register">สมัครสมาชิก</button>
            </div>
            <img class="apdino" src="img/Dino/4.png" alt="Dino ต้อนรับสมาชิกใหม่"/>
            <form id="loginForm" class="apform">
               <div class="aperr" id="loginErr"></div>
               <label class="flbl" data-i18n="auth.email">อีเมล</label>
               <input class="fctrl" type="email" id="loginEmail" placeholder="you@email.com" autocomplete="email" required/>
               <label class="flbl" data-i18n="auth.password">รหัสผ่าน</label>
               <input class="fctrl" type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required/>
               <button type="submit" class="btn-red w-100 justify-content-center mt-2"><i class="fas fa-right-to-bracket"></i><span data-i18n="auth.login">เข้าสู่ระบบ</span></button>
               <p class="apnote"><span data-i18n="auth.noAccount">ยังไม่มีบัญชี?</span> <a href="#" data-switch="register" data-i18n="auth.registerLink">สมัครสมาชิกเลย</a></p>
            </form>
            <form id="registerForm" class="apform" style="display:none;">
               <div class="aperr" id="registerErr"></div>
               <label class="flbl" data-i18n="auth.yourName">ชื่อของคุณ</label>
               <input class="fctrl" type="text" id="registerName" placeholder="ชื่อ นามสกุล" autocomplete="name" required/>
               <label class="flbl" data-i18n="auth.email">อีเมล</label>
               <input class="fctrl" type="email" id="registerEmail" placeholder="you@email.com" autocomplete="email" required/>
               <label class="flbl" data-i18n="auth.password">รหัสผ่าน</label>
               <input class="fctrl" type="password" id="registerPassword" placeholder="อย่างน้อย 4 ตัวอักษร" autocomplete="new-password" required/>
               <button type="submit" class="btn-red w-100 justify-content-center mt-2"><i class="fas fa-egg"></i><span data-i18n="auth.createAccount">สร้างบัญชี</span></button>
               <p class="apnote"><span data-i18n="auth.haveAccount">มีบัญชีอยู่แล้ว?</span> <a href="#" data-switch="login" data-i18n="auth.loginLink">เข้าสู่ระบบ</a></p>
               <p class="apdisclaimer"><i class="fas fa-circle-info me-1"></i><span data-i18n="auth.disclaimer">ระบบสมาชิกเวอร์ชันทดลอง ข้อมูลเก็บไว้ในเบราว์เซอร์นี้เท่านั้น</span></p>
            </form>
         </div>
      </div>

      <div id="appToast"></div>

      <script src="js/chimchim-i18n.js"></script>
      <script src="js/chimchim-data.js" defer></script>
      <script src="js/chimchim-core.js" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
      <script src="js/chimchim-supabase-config.js" defer></script>
      <script src="js/chimchim-supabase-client.js" defer></script>
      <script src="js/chimchim-community.js" defer></script>
      <script src="js/chimchim-publicprofile.js" defer></script>
         <script>
         if ("serviceWorker" in navigator) {
            window.addEventListener("load", function() {
               navigator.serviceWorker.register("sw.js").catch(function() {});
            });
         }
      </script>
   </body>
</html>
