<!DOCTYPE html>
<html lang="th">
   <head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="author" content="CHIMCHIM">
      <meta name="description" content="ChimChim - AI Food Finder ตอบคำถามสั้น ๆ แล้วให้ AI ช่วยเลือกร้านที่ใช่สำหรับคุณ">
      <title>AI Food Finder - ChimChim</title>
      <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
      <link rel="stylesheet" href="css/all.min.css"/>
      <link rel="stylesheet" href="css/style.css" />
   </head>
   <body class="appshell">
      <header class="apptop">
         <a href="home.html" class="apptop-logo">
            <div class="aico"><img src="img/Dino/8.png" alt="CHIMCHIM"/></div>
            <div class="anm">CHIM<span>CHIM</span></div>
         </a>
         <div class="apptop-actions">
            <div class="qsettingswrap">
               <button type="button" id="quickSettingsBtn" class="apptop-btn" title="Settings"><i class="fas fa-gear"></i></button>
               <div class="qspanel" id="quickSettingsPanel" hidden>
                  <div class="qsrow">
                     <span class="qslbl" data-i18n="settings.appearance">Appearance</span>
                     <div class="qstoggle">
                        <button type="button" data-theme-choice="light" title="Light"><i class="fas fa-sun"></i></button>
                        <button type="button" data-theme-choice="dark" title="Dark"><i class="fas fa-moon"></i></button>
                     </div>
                  </div>
                  <div class="qsrow">
                     <span class="qslbl" data-i18n="settings.language">Language</span>
                     <div class="qstoggle">
                        <button type="button" data-lang-choice="en" title="English">🇬🇧</button>
                        <button type="button" data-lang-choice="th" title="ไทย">🇹🇭</button>
                     </div>
                  </div>
                  <a href="settings.html" class="qsmore" data-i18n="profile.settings">Settings</a>
               </div>
            </div>
            <button id="loginBtn" class="apptop-loginbtn" data-i18n="auth.login">เข้าสู่ระบบ</button>
            <a href="profile.html" id="userAvatarLink" class="apptop-avatar" hidden><span id="userAvatarIco">🦖</span></a>
         </div>
      </header>

      <div class="aichat-wrap">
         <div class="aichat-top">
            <img src="img/Dino/7.png" alt="Dino คิด"/>
            <div>
               <div class="aichat-hi" data-i18n="ai.greetingTitle">สวัสดี 👋</div>
               <div class="aichat-sub" data-i18n="ai.greetingSub">คุยกับ ChimChim ได้เลย ถามอะไรก็ได้ ไม่ใช่แค่เรื่องกิน</div>
            </div>
         </div>

         <div class="aichat-body" id="aiChatBody"></div>

         <div class="aichat-suggestrow" id="aiSuggestRow"></div>

         <form class="aichat-inputbar" id="aiChatForm">
            <input type="text" id="aiChatInput" data-i18n-ph="ai.inputPlaceholder" placeholder="พิมพ์อะไรก็ได้ เช่น อยากกินเผ็ด ๆ งบไม่เกิน 150 บาท" autocomplete="off"/>
            <button type="submit" id="aiChatSend"><i class="fas fa-paper-plane"></i></button>
         </form>
      </div>

      <nav class="appnav">
         <a href="home.html" class="anitem"><i class="fas fa-fire"></i><span data-i18n="nav.trending">เทรนด์</span></a>
         <a href="ai-finder.html" class="anitem active"><i class="fas fa-brain"></i><span data-i18n="nav.ai">AI</span></a>
         <a href="roulette.html" class="ancenter"><img src="img/Dino/1.png" alt="สุ่มเมนู"/></a>
         <a href="following.html" class="anitem"><i class="fas fa-users"></i><span data-i18n="nav.following">ติดตาม</span></a>
         <a href="profile.html" class="anitem"><i class="fas fa-user"></i><span data-i18n="nav.profile">โปรไฟล์</span></a>
      </nav>

      <!-- ============================================================
         AUTH POPUP — เข้าสู่ระบบ / สมัครสมาชิก
         ============================================================ -->
      <div id="authPop">
         <div class="apbox">
            <button class="apclose" id="apClose"><i class="fas fa-times"></i></button>
            <div class="aptabs">
               <button class="aptab active" id="apTabLogin" data-tab="login" data-i18n="auth.login">เข้าสู่ระบบ</button>
               <button class="aptab" id="apTabRegister" data-tab="register" data-i18n="auth.register">สมัครสมาชิก</button>
            </div>
            <img class="apdino" src="img/Dino/4.png" alt="Dino ต้อนรับสมาชิกใหม่"/>
            <form id="loginForm" class="apform">
               <div class="aperr" id="loginErr"></div>
               <label class="flbl" data-i18n="auth.email">อีเมล</label>
               <input class="fctrl" type="email" id="loginEmail" placeholder="you@email.com" autocomplete="email" required/>
               <label class="flbl" data-i18n="auth.password">รหัสผ่าน</label>
               <input class="fctrl" type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required/>
               <button type="submit" class="btn-red w-100 justify-content-center mt-2"><i class="fas fa-right-to-bracket"></i><span data-i18n="auth.login">เข้าสู่ระบบ</span></button>
               <p class="apnote"><span data-i18n="auth.noAccount">ยังไม่มีบัญชี?</span> <a href="#" data-switch="register" data-i18n="auth.registerLink">สมัครสมาชิกเลย</a></p>
            </form>
            <form id="registerForm" class="apform" style="display:none;">
               <div class="aperr" id="registerErr"></div>
               <label class="flbl" data-i18n="auth.yourName">ชื่อของคุณ</label>
               <input class="fctrl" type="text" id="registerName" placeholder="ชื่อ นามสกุล" autocomplete="name" required/>
               <label class="flbl" data-i18n="auth.email">อีเมล</label>
               <input class="fctrl" type="email" id="registerEmail" placeholder="you@email.com" autocomplete="email" required/>
               <label class="flbl" data-i18n="auth.password">รหัสผ่าน</label>
               <input class="fctrl" type="password" id="registerPassword" placeholder="อย่างน้อย 4 ตัวอักษร" autocomplete="new-password" required/>
               <button type="submit" class="btn-red w-100 justify-content-center mt-2"><i class="fas fa-egg"></i><span data-i18n="auth.createAccount">สร้างบัญชี</span></button>
               <p class="apnote"><span data-i18n="auth.haveAccount">มีบัญชีอยู่แล้ว?</span> <a href="#" data-switch="login" data-i18n="auth.loginLink">เข้าสู่ระบบ</a></p>
               <p class="apdisclaimer"><i class="fas fa-circle-info me-1"></i><span data-i18n="auth.disclaimer">ระบบสมาชิกเวอร์ชันทดลอง ข้อมูลเก็บไว้ในเบราว์เซอร์นี้เท่านั้น</span></p>
            </form>
         </div>
      </div>

      <div id="appToast"></div>

      <script src="js/aos.js"></script>
      <script src="js/chimchim-i18n.js"></script>
      <script src="js/chimchim-data.js"></script>
      <script src="js/chimchim-core.js"></script>
      <script src="js/chimchim-nav.js"></script>
      <script src="js/chimchim-aifinder.js"></script>
      <script src="js/chimchim-community.js"></script>
   </body>
</html>
