<!DOCTYPE html>
<html lang="th">
   <head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="author" content="CHIMCHIM">
      <link rel="manifest" href="manifest.json">
      <meta name="theme-color" content="#ff999d">
      <meta name="apple-mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-status-bar-style" content="default">
      <meta name="apple-mobile-web-app-title" content="ChimChim">
      <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
      <meta name="description" content="ChimChim - โปรไฟล์นักชิมในชุมชน">
      <title>โปรไฟล์ - ChimChim</title>
      <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
      <link rel="stylesheet" href="css/all.min.css"/>
      <link rel="stylesheet" href="css/style.css" />
   </head>
   <body class="appshell">
      <div class="obtopnav" style="max-width:520px;margin:0 auto;padding:20px 20px 0;">
         <button class="obback" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
         <span class="obstepnum" data-i18n="nav.profile">โปรไฟล์</span>
         <span style="width:38px;"></span>
      </div>

      <!-- ระหว่างรอถามโปรไฟล์จริงจาก Supabase (คนที่เครื่องนี้ไม่เคยเห็นมาก่อน) โชว์โครงนี้แทนที่จะโผล่ว่าง ๆ ก่อนเจอจริง -->
      <div class="profwrap" id="ppSkeleton" hidden>
         <div class="profhead">
            <div class="skeleton" style="width:64px;height:64px;border-radius:50%;flex-shrink:0;"></div>
            <div style="flex:1;">
               <div class="skeleton" style="height:18px;width:60%;margin-bottom:8px;"></div>
               <div class="skeleton" style="height:13px;width:40%;"></div>
            </div>
         </div>
         <div class="skeleton" style="height:38px;width:100%;border-radius:50px;margin:14px 0;"></div>
      </div>

      <div class="profwrap" id="ppContent">
         <div class="profhead">
            <div class="profavatar" id="ppAvatar"></div>
            <div>
               <div class="profname" id="ppName"></div>
               <div class="profemail" id="ppSub"></div>
               <span class="profrole" id="ppLevel"></span>
            </div>
         </div>

         <p class="sdesc mb-3" id="ppBio" style="font-size:.85rem;"></p>

         <button class="btn-red profbtn" id="ppFollowBtn"><i class="fas fa-user-plus"></i><span data-i18n="common.follow">Follow</span></button>

         <div class="profcard">
            <div class="profcardtit"><i class="fas fa-image me-1"></i><span data-i18n="publicprofile.recentPosts">โพสต์ล่าสุด</span></div>
            <div class="ppgrid" id="ppPostGrid"></div>
            <p id="ppEmpty" class="text-center" style="color:#bbb;font-size:.82rem;padding:20px 0;" hidden data-i18n="publicprofile.noPosts">ยังไม่มีโพสต์</p>
         </div>
      </div>

      <div id="appToast"></div>

      <script src="js/chimchim-i18n.js"></script>
      <script src="js/chimchim-data.js"></script>
      <script src="js/chimchim-core.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
      <script src="js/chimchim-supabase-config.js"></script>
      <script src="js/chimchim-supabase-client.js"></script>
      <script src="js/chimchim-community.js"></script>
      <script src="js/chimchim-publicprofile.js"></script>
         <script>
         if ("serviceWorker" in navigator) {
            window.addEventListener("load", function() {
               navigator.serviceWorker.register("sw.js").catch(function() {});
            });
         }
      </script>
   </body>
</html>
